name: bump-roslyn-ls

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: bump the pin
        run: |
          # No stable release exists, so --prerelease is load-bearing. Exits 0 when
          # already current, which makes a quiet week a no-op rather than a red build.
          dotnet tool update roslyn-language-server --prerelease
          # dotnet tool update rewrites the manifest without a trailing newline.
          if [ -n "$(tail -c1 .config/dotnet-tools.json)" ]; then
            printf '\n' >> .config/dotnet-tools.json
          fi

      # A new pin is a new release, so the tool version moves with it. Guarded on the
      # manifest actually having changed: `dotnet tool update` exits 0 when already
      # current, and an unconditional bump would open a PR every quiet week.
      - name: bump the tool version
        run: |
          if git diff --quiet .config/dotnet-tools.json; then
            echo "pin unchanged; leaving Version alone"
            exit 0
          fi
          csproj=src/Cslq/Cslq.csproj
          current=$(sed -n 's@.*<Version>\(.*\)</Version>.*@\1@p' "$csproj" | head -1)
          next="${current%.*}.$(( ${current##*.} + 1 ))"
          sed -i "s@<Version>$current</Version>@<Version>$next</Version>@" "$csproj"
          echo "cslq $current -> $next"

      - id: pin
        run: |
          version=$(sed -n 's/.*"version": "\(5\.[^"]*\)".*/\1/p' .config/dotnet-tools.json | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Before the gate, so no path to a release skips the format check.
      - run: dotnet format --verify-no-changes

      - run: ./probes/run.sh

      - uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          title: "bump roslyn-language-server to ${{ steps.pin.outputs.version }}"
          branch: chore/bump-roslyn-ls
          commit-message: "bump roslyn-language-server to ${{ steps.pin.outputs.version }}"
          add-paths: |
            .config/dotnet-tools.json
            src/Cslq/Cslq.csproj
          body: |
            Automated weekly bump of the pinned language server.

            `probes/run.sh` passed against `${{ steps.pin.outputs.version }}` on this runner
            before the PR was opened.

      # The probe.yml run GitHub creates for a PR opened with GITHUB_TOKEN parks at
      # action_required until a human approves it, so on its own the PR shows no gate.
      # workflow_dispatch (like repository_dispatch) is exempt from that suppression, and its
      # check runs land on the branch head under the same `probe (<os>)` names the ruleset on
      # main requires — the same three-OS gate a human PR gets.
      - if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run probe.yml --ref "${{ steps.cpr.outputs.pull-request-branch }}"
