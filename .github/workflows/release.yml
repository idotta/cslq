name: release

# Tag-triggered, so a release is `git tag v0.1.0 && git push --tags`. The gate runs first:
# nothing reaches nuget.org that has not survived probes/run.sh on this runner.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Trusted publishing: the job's OIDC token is exchanged with nuget.org for a one-hour API
    # key, so no long-lived secret exists to leak. The policy on nuget.org names this repo,
    # this file (release.yml) and the environment below; anything else is refused.
    permissions:
      contents: read
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v7

      # The tag is what names the package, so a tag that disagrees with <Version> would
      # publish a version nobody asked for. Checked before the gate: it costs nothing.
      - name: tag matches <Version>
        run: |
          version=$(sed -n 's@.*<Version>\(.*\)</Version>.*@\1@p' src/Cslq/Cslq.csproj | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match <Version>$version</Version> in src/Cslq/Cslq.csproj" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The RID payload behind the tool is ~300 MB; the pin is the cache key so a bump
      # misses on purpose.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('.config/dotnet-tools.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Before the gate, so no path to a release skips the format check.
      - run: dotnet format --verify-no-changes

      - run: ./probes/run.sh

      - run: dotnet pack src/Cslq/Cslq.csproj -c Release -o artifacts --nologo

      # Requested after the gate and the pack, not before: the key it returns lives one hour
      # and probes/run.sh alone can take several minutes cold. NUGET_USER is the nuget.org
      # profile name of the policy owner, not an email address.
      - name: nuget.org login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
